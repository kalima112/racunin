<html lang="id">
<head>

<style>

:root{
  --bg:#fffaf5;--ink:#171717;--muted:#6f6a64;--card:#fff;--line:#eadfd3;
  --accent:#ff6b35;--accent-dark:#d94e1d;--soft:#fff0e8;--soft2:#fff6ef;
  --green:#198754;--shadow:0 14px 40px rgba(52,31,12,.08)
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
a{text-decoration:none;color:inherit}
img{max-width:100%;display:block}
.wrap{max-width:1160px;margin:auto;padding:0 20px}
nav{height:72px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
.logo{font-weight:950;font-size:25px;letter-spacing:-1.5px}.logo span{color:var(--accent)}
.navlinks{display:flex;gap:24px;color:#5f5953;font-weight:750;font-size:14px}.navlinks a:hover{color:var(--accent-dark)}
.nav-cta{background:var(--ink);color:#fff;padding:10px 14px;border-radius:11px}
.hero{padding:68px 0 42px;display:grid;grid-template-columns:1.12fr .88fr;gap:34px;align-items:center}
.badge{display:inline-block;background:var(--soft);color:var(--accent-dark);border-radius:999px;padding:8px 12px;font-size:13px;font-weight:850}
h1{font-size:clamp(44px,6.2vw,76px);line-height:.97;letter-spacing:-4.5px;margin:18px 0}
.hero p{font-size:18px;line-height:1.65;color:var(--muted);max-width:680px}
.search{margin-top:24px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:6px;display:flex;box-shadow:var(--shadow)}
.search input{flex:1;border:0;outline:0;padding:15px;font-size:16px;background:transparent;min-width:0}.search button{border:0;background:var(--ink);color:#fff;padding:13px 20px;border-radius:13px;font-weight:850;cursor:pointer}
.hero-card{background:var(--ink);color:#fff;border-radius:30px;padding:30px;min-height:300px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:var(--shadow);transform:rotate(1deg)}
.hero-card .emoji{font-size:66px}.hero-card h2{font-size:32px;margin:0;letter-spacing:-1.2px}.hero-card p{color:#c9c4bf;margin:8px 0 0;font-size:14px;line-height:1.55}
section{padding:34px 0 56px}.section-head{display:flex;justify-content:space-between;align-items:end;gap:16px;margin-bottom:18px}
.section-title{font-size:31px;letter-spacing:-1.7px;margin:0}.section-note{color:var(--muted);font-size:14px}
.chips{display:flex;gap:10px;overflow:auto;padding-bottom:5px}.chip{white-space:nowrap;padding:11px 15px;border:1px solid var(--line);background:#fff;border-radius:999px;font-weight:800;font-size:14px;cursor:pointer}.chip.active{background:var(--ink);color:#fff}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.product{background:#fff;border:1px solid var(--line);border-radius:21px;padding:14px;display:flex;flex-direction:column;min-height:350px;transition:.2s ease;box-shadow:0 3px 16px rgba(52,31,12,.025)}
.product:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.pic{height:170px;border-radius:16px;background:linear-gradient(135deg,#ffe8db,#fff);display:grid;place-items:center;font-size:64px;margin-bottom:13px}
.tag{font-size:11px;font-weight:900;color:var(--accent-dark);text-transform:uppercase;letter-spacing:.55px}.rating{font-size:12px;color:#7a7169;margin-top:5px}
.product h3{font-size:17px;margin:6px 0;line-height:1.22}.price{font-weight:950;margin-top:auto;padding-top:10px}.buy{margin-top:11px;background:var(--accent);color:#fff;text-align:center;padding:12px;border-radius:12px;font-weight:900;font-size:13px}.buy:hover{background:var(--accent-dark)}
.article-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.article{background:#fff;border:1px solid var(--line);padding:22px;border-radius:21px;box-shadow:0 3px 16px rgba(52,31,12,.025)}.article:hover{box-shadow:var(--shadow)}
.article .mini{font-size:12px;color:var(--muted);font-weight:850}.article h3{font-size:20px;line-height:1.2;margin:10px 0}.article p{color:var(--muted);line-height:1.55}
.info{background:#171717;color:#fff;border-radius:26px;padding:28px;display:grid;grid-template-columns:1fr 1fr;gap:25px}.info p{color:#c9c4bf;line-height:1.6}.info h2{margin:0;font-size:28px;letter-spacing:-1px}
footer{border-top:1px solid var(--line);padding:34px 0 54px;color:var(--muted);font-size:13px;line-height:1.65}.footer-grid{display:grid;grid-template-columns:1.5fr 1fr 1fr;gap:30px}.footer-title{font-weight:900;color:var(--ink);margin-bottom:8px}.footer-links{display:grid;gap:6px}.footer-links a:hover{color:var(--accent-dark)}
.breadcrumb{padding:25px 0 8px;color:var(--muted);font-size:13px}.breadcrumb a{color:var(--accent-dark);font-weight:800}
.detail{padding:30px 0 70px}.detail-grid{display:grid;grid-template-columns:.9fr 1.1fr;gap:40px;align-items:start}
.detail-pic{min-height:470px;border-radius:28px;background:linear-gradient(135deg,#ffe5d6,#fff);display:grid;place-items:center;font-size:140px;border:1px solid var(--line)}
.detail h1{font-size:clamp(42px,5vw,66px);letter-spacing:-3.5px;margin:8px 0 16px}.detail .lead{font-size:18px;line-height:1.65;color:var(--muted)}
.price-big{font-size:30px;font-weight:950;margin:20px 0 4px}.meta{color:var(--muted);font-size:14px}
.checklist{margin:24px 0;padding:0;list-style:none;display:grid;gap:11px}.checklist li{background:#fff;border:1px solid var(--line);padding:12px 14px;border-radius:13px}
.disclosure{font-size:12px;color:var(--muted);margin-top:14px}
.article-page{padding:30px 0 70px}.article-page .content{max-width:820px}.article-page h1{font-size:clamp(42px,5vw,64px);margin-bottom:18px}.article-page .intro{font-size:19px;color:var(--muted);line-height:1.65}.article-page h2{font-size:29px;letter-spacing:-1px;margin-top:38px}.article-page p,.article-page li{font-size:17px;line-height:1.75;color:#4f4944}.article-page .callout{background:var(--soft2);border:1px solid var(--line);border-radius:18px;padding:20px;margin:25px 0}.article-page .callout strong{display:block;color:var(--ink);margin-bottom:5px}
.pill-row{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}.pill{padding:7px 10px;border-radius:999px;background:var(--soft);color:var(--accent-dark);font-size:12px;font-weight:850}
.back{display:inline-block;margin-top:20px;color:var(--accent-dark);font-weight:850}
@media(max-width:900px){.hero{grid-template-columns:1fr}.hero-card{transform:none}.grid{grid-template-columns:repeat(2,1fr)}.article-grid{grid-template-columns:1fr}.detail-grid{grid-template-columns:1fr}.detail-pic{min-height:320px}.info{grid-template-columns:1fr}.footer-grid{grid-template-columns:1fr 1fr}}
@media(max-width:600px){.wrap{padding:0 15px}.navlinks{display:none}.hero{padding-top:44px}h1{letter-spacing:-2.8px}.grid{grid-template-columns:1fr 1fr;gap:10px}.product{min-height:330px;padding:11px}.pic{height:125px;font-size:52px}.product h3{font-size:15px}.search button{padding:13px 15px}.footer-grid{grid-template-columns:1fr}.detail-pic{min-height:260px;font-size:105px}}

</style>
